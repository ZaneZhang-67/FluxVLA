name: Export package tests

on:
  pull_request:
    branches: [master, main]
    paths:
      - 'packages/fluxvla-export/**'
      - '.github/workflows/export-package-tests.yml'
  push:
    branches: [master, main, feature/fluxvla-export]
    paths:
      - 'packages/fluxvla-export/**'
      - '.github/workflows/export-package-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: export-package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  standalone-wheel:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    env:
      CUDA_VISIBLE_DEVICES: ''
      PYTHONNOUSERSITE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: packages/fluxvla-export/pyproject.toml
      - name: Build wheel and source distribution without FluxVLA
        run: |
          python -m pip install build
          python -m build --outdir "$RUNNER_TEMP/export-dist" packages/fluxvla-export
      - name: Install wheel into an independent CPU environment
        run: |
          python -m venv "$RUNNER_TEMP/export-runtime"
          runtime="$RUNNER_TEMP/export-runtime/bin/python"
          "$runtime" -m pip install --no-deps torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          wheels=("$RUNNER_TEMP"/export-dist/*.whl)
          test "${#wheels[@]}" -eq 1
          "$runtime" -m pip install "${wheels[0]}[test]" numpy==1.26.4
          "$runtime" -m pip check
      - name: Verify isolated import and package metadata
        run: |
          "$RUNNER_TEMP/export-runtime/bin/python" -I - <<'PY'
          import importlib.metadata
          import importlib.resources
          import importlib.util
          import sys
          import fluxvla_export
          from fluxvla_export.registry import available_recipes
          assert 'site-packages' in fluxvla_export.__file__
          assert available_recipes() == ()
          assert 'torch' not in sys.modules
          assert 'safetensors' not in sys.modules
          for name in ('fluxvla', 'fluxhermes', 'mmengine', 'transformers', 'triton'):
              assert importlib.util.find_spec(name) is None, name
          assert importlib.resources.files('fluxvla_export').joinpath('py.typed').is_file()
          dist = importlib.metadata.distribution('fluxvla-export')
          assert any(str(path).endswith('/LICENSE') for path in dist.files)
          print(fluxvla_export.__file__)
          print('Isolated wheel import and metadata: OK')
          PY
      - name: Run copied tests against the installed wheel
        run: |
          cp -R packages/fluxvla-export/tests "$RUNNER_TEMP/export-tests"
          "$RUNNER_TEMP/export-runtime/bin/python" -I -m unittest discover -s "$RUNNER_TEMP/export-tests" -v
