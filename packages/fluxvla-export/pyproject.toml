[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxvla-export"
version = "0.1.0"
description = "Minimal FluxVLA model frontend for FluxHermes builds"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {file = "LICENSE"}
authors = [
  {name = "FluxVLA Contributors"},
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "torch>=2.8,<2.9",
  "safetensors>=0.6.2,<0.7",
  # safetensors.torch imports packaging but does not declare it in its core.
  "packaging>=23.2",
]

[project.optional-dependencies]
# safetensors 0.6.2 uses NumPy to serialize test tensors.
test = ["numpy>=1.26,<3"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fluxvla_export = ["py.typed"]
